<!-- The notes that link to this post, a section of the right panel below the graph, added by
     _plugins/notes-graph.rb. The title of each note is the link, and its description shows as the
     tooltip. -->
<section class="backlinks" aria-labelledby="backlinks-heading">
  <h2 id="backlinks-heading" class="panel-heading">Linked from</h2>
  <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
    {% for note in page.backlinks %}
      <li class="lh-base mb-2">
        <a href="{{ note.url | relative_url }}"{% if note.description %} title="{{ note.description | escape }}"{% endif %}>{{ note.title }}</a>
      </li>
    {% endfor %}
  </ul>
</section>
