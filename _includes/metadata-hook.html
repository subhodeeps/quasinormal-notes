<!-- Chirpy's placeholder for custom <head> content (included from _includes/head.html) -->

<!-- Chirpy's viewport meta forbids zooming (user-scalable=no), so that nobody can enlarge an equation or a
     block of code on a phone. This puts the zoom back without a copy of Chirpy's head. -->
<script>
  (function () {
    var meta = document.querySelector('meta[name="viewport"]');
    if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
  })();
</script>

<!-- JetBrains Mono for code (_sass/_code-font.scss), loaded without holding up the first paint:
     the text shows in the fallback monospace font until it arrives. Google Fonts is already
     preconnected by Chirpy. -->
<link
  rel="preload"
  as="style"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap"
  >
</noscript>

{% if jekyll.environment == 'production' %}
<!-- Browsers with speculation rules (Chromium) prefetch the pages of internal links when the reader
     is about to open one; assets/js/prefetch.js does the same for the others -->
<script type="speculationrules">
  {"prefetch": [{"where": {"and": [{"href_matches": "/*"}, {"not": {"href_matches": "/assets/*"}}]}, "eagerness": "moderate"}]}
</script>
{% endif %}
<script defer src="{{ '/assets/js/prefetch.js' | relative_url }}"></script>

<!-- A link into a folded box (<details>), such as a citation that points to the references,
     opens the box first, so that the browser can scroll to the target. -->
<script>
  (function () {
    function openAround(id) {
      var target = id && document.getElementById(id);
      for (var box = target && target.closest('details'); box; box = box.parentElement.closest('details')) {
        box.open = true;
      }
    }
    document.addEventListener('click', function (event) {
      var link = event.target.closest('a[href^="#"]');
      if (link) openAround(decodeURIComponent(link.getAttribute('href').slice(1)));
    });
    document.addEventListener('DOMContentLoaded', function () {
      openAround(decodeURIComponent(location.hash.slice(1)));
    });
  })();
</script>
{% if page.layout == 'post' %}
<!-- No separating dot at the start of a wrapped line of the byline -->
<script defer src="{{ '/assets/js/post-meta-lines.js' | relative_url }}"></script>
{% endif %}
<!-- Enlarged figures open in the theme the page shows (Chirpy's GLightbox popup) -->
<script defer src="{{ '/assets/js/lightbox-theme.js' | relative_url }}"></script>
{% if page.layout == 'category' or page.layout == 'tag' or page.layout == 'home' %}
<!-- Buttons that sort the posts of a category or a tag page, or the Explore tiles of the home
     page, by date or by title -->
<script defer src="{{ '/assets/js/list-sort.js' | relative_url }}"></script>
{% endif %}
{% unless jekyll.environment == 'production' %}

<!-- The local preview has no offline cache. Chirpy registers its service worker only in
     production builds, but one that a production build left behind (tools/test.sh builds into the
     same _site) would keep serving old pages and scripts, so the preview removes it. -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (registrations) {
      registrations.forEach(function (registration) {
        registration.unregister();
      });
    });
  }
</script>
{% endunless %}
